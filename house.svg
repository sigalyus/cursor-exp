<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f5"/>
      <stop offset="1" stop-color="#e6f5ff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <!-- sun -->
  <circle cx="680" cy="110" r="50" fill="#ffd93b"/>
  <!-- clouds -->
  <g fill="#fff" opacity="0.9">
    <ellipse cx="150" cy="100" rx="60" ry="22"/><ellipse cx="190" cy="88" rx="40" ry="20"/>
    <ellipse cx="480" cy="150" rx="55" ry="18"/><ellipse cx="515" cy="140" rx="35" ry="16"/>
  </g>
  <!-- ground -->
  <rect y="430" width="800" height="170" fill="#6bbf59"/>
  <!-- path -->
  <polygon points="365,430 435,430 500,600 300,600" fill="#d9c7a1"/>
  <!-- chimney -->
  <rect x="535" y="170" width="40" height="90" fill="#a0522d"/>
  <rect x="530" y="162" width="50" height="12" fill="#7a3e20"/>
  <!-- walls -->
  <rect x="200" y="270" width="400" height="200" fill="#f2d49b"/>
  <!-- roof -->
  <polygon points="170,275 400,110 630,275" fill="#c0392b"/>
  <polygon points="170,275 400,110 630,275 600,275 400,135 200,275" fill="#962d22"/>
  <!-- door -->
  <rect x="365" y="340" width="70" height="130" rx="4" fill="#7a4a2a"/>
  <circle cx="422" cy="408" r="5" fill="#ffd93b"/>
  <!-- windows -->
  <g>
    <rect x="235" y="320" width="85" height="75" fill="#9fd8f5" stroke="#fff" stroke-width="6"/>
    <line x1="277" y1="320" x2="277" y2="395" stroke="#fff" stroke-width="4"/>
    <line x1="235" y1="357" x2="320" y2="357" stroke="#fff" stroke-width="4"/>
    <rect x="480" y="320" width="85" height="75" fill="#9fd8f5" stroke="#fff" stroke-width="6"/>
    <line x1="522" y1="320" x2="522" y2="395" stroke="#fff" stroke-width="4"/>
    <line x1="480" y1="357" x2="565" y2="357" stroke="#fff" stroke-width="4"/>
  </g>
  <!-- attic window -->
  <circle cx="400" cy="225" r="26" fill="#9fd8f5" stroke="#fff" stroke-width="6"/>
  <!-- trees -->
  <g>
    <rect x="95" y="370" width="16" height="70" fill="#6b4423"/>
    <circle cx="103" cy="350" r="50" fill="#2e8b3d"/>
    <rect x="690" y="385" width="14" height="60" fill="#6b4423"/>
    <circle cx="697" cy="365" r="42" fill="#37a047"/>
  </g>
  <!-- flowers -->
  <g fill="#ff6fa5">
    <circle cx="240" cy="470" r="6"/><circle cx="270" cy="478" r="6"/>
    <circle cx="540" cy="472" r="6"/><circle cx="570" cy="480" r="6"/>
  </g>
</svg>
